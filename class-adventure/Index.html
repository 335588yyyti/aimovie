<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<base target="_top">
<title>知識群島</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chiron+GoRound+TC:wght@400;600;800&display=swap">
<style>
/* 粉彩海洋：天空藍漸層海面、奶油色卡片、蜜桃粉當主要按鈕色；全部用圓體 */
:root{
  --sky:#c9f0f7; --sea:#9fdcec; --sea2:#7ccbe2; --wave:#e9fbff;
  --cream:#fffaf0; --cream2:#fff3dc; --ink:#4a4566; --muted:#8a85a3;
  --peach:#ff8fa3; --peach-d:#e66d84; --butter:#ffd66b; --mint:#7fd8b5; --lav:#b9a6f0; --sky-b:#7cc2ff;
  --ok:#3fb989; --ok-bg:#e3f8ee; --no:#ff7a8a; --no-bg:#ffe8ec; --blush:#ffb3c1;
  --f:"Chiron GoRound TC","Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:var(--f);color:var(--ink);font-size:17px;line-height:1.6;
  background:linear-gradient(180deg,var(--sky) 0%,var(--sea) 55%,var(--sea2) 100%) fixed}
/* 漂浮的雲和泡泡 */
.sky{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.cloud{position:absolute;background:#fff;border-radius:999px;opacity:.85;animation:drift 38s linear infinite}
.cloud::before,.cloud::after{content:"";position:absolute;background:#fff;border-radius:50%}
.cloud::before{width:55%;height:160%;left:15%;bottom:20%}
.cloud::after{width:40%;height:130%;right:12%;bottom:25%}
.c1{width:120px;height:34px;top:7%;left:-140px}
.c2{width:90px;height:26px;top:18%;left:-120px;animation-duration:52s;animation-delay:-20s}
.c3{width:150px;height:40px;top:4%;left:-160px;animation-duration:64s;animation-delay:-40s}
@keyframes drift{to{transform:translateX(calc(100vw + 320px))}}
.bubble{position:absolute;bottom:-20px;width:12px;height:12px;border-radius:50%;border:2px solid rgba(255,255,255,.7);animation:rise 12s ease-in infinite}
@keyframes rise{to{transform:translateY(-105vh);opacity:0}}
.wrap{position:relative;z-index:1;max-width:880px;margin:0 auto;padding-block:16px 48px;padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right))}
h1,h2,h3{font-weight:800;margin:0;text-wrap:balance}
button{font:inherit;cursor:pointer;border:0;border-radius:18px;color:inherit}
button:focus-visible,input:focus-visible{outline:4px solid var(--butter);outline-offset:2px}
input{font:inherit;padding:12px 16px;border:3px solid #f1e3c8;border-radius:16px;background:#fff;width:100%;color:var(--ink)}
input:focus{border-color:var(--peach)}
label{display:block;font-weight:800;margin-bottom:6px}
.btn{background:var(--peach);color:#fff;padding:12px 24px;font-weight:800;font-size:18px;box-shadow:0 5px 0 var(--peach-d);transition:transform .1s}
.btn:hover{transform:translateY(-1px)}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--peach-d)}
.btn.soft{background:#fff;color:var(--ink);box-shadow:0 4px 0 #d9eef4}
.btn.small{padding:6px 14px;font-size:15px}
.btn:disabled{opacity:.5;cursor:default}
.hidden{display:none!important}
.card{background:var(--cream);border-radius:28px;padding:24px;box-shadow:0 8px 0 rgba(74,69,102,.10);border:3px solid #fff}

/* 吉祥物與對話框 */
.talk{display:flex;align-items:flex-end;gap:10px}
.talk svg.mascot{width:96px;height:auto;flex:none}
.say{position:relative;background:#fff;border-radius:22px;padding:12px 16px;font-weight:600;box-shadow:0 4px 0 rgba(74,69,102,.08);min-width:0;flex:1}
.say::before{content:"";position:absolute;left:-10px;bottom:18px;border:10px solid transparent;border-right-color:#fff;border-left:0}
.bob{animation:bob 2.6s ease-in-out infinite;transform-origin:50% 100%}
@keyframes bob{50%{transform:translateY(-5px) rotate(-2deg)}}
.blink{animation:blink 4s infinite;transform-origin:center;transform-box:fill-box}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}

/* 登入 */
.login{max-width:440px;margin:4vh auto 0;display:grid;gap:16px}
.logo{text-align:center}
.logo h1{font-size:46px;letter-spacing:.1em;color:var(--peach);-webkit-text-stroke:2px #fff;paint-order:stroke fill;text-shadow:0 4px 0 #fff,0 7px 0 rgba(74,69,102,.12)}
.logo p{margin:2px 0 0;font-weight:600;color:var(--ink)}
.form{display:grid;gap:14px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.hint{font-size:14px;color:var(--muted);margin:0}
.err{color:var(--no);font-weight:800;margin:0;min-height:1.4em}
.check{display:flex;gap:8px;align-items:center;font-weight:600;font-size:15px}
.check input{width:22px;height:22px;accent-color:var(--peach)}

/* 頂部 */
.top{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;margin-bottom:14px}
.who{flex:1 1 220px;min-width:0}
.who b{font-size:24px;display:block;line-height:1.3}
.who small{color:var(--ink);opacity:.75;font-weight:600}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{background:#fff;border-radius:999px;padding:6px 14px 6px 8px;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap;display:flex;align-items:center;gap:6px;box-shadow:0 3px 0 rgba(74,69,102,.08)}
.chip svg{width:24px;height:24px}
.today{margin-bottom:18px}
.seal{width:64px;height:64px;flex:none;border-radius:50%;border:3px dashed #e6d3ad;display:grid;place-items:center;font-weight:800;font-size:15px;color:#cdb68a;background:var(--cream2);transform:rotate(-8deg)}
.seal.on{border:3px solid var(--peach);color:var(--peach);background:#fff0f3}
.today .say{display:flex;gap:12px;align-items:center}

/* 群島 */
.map{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px 14px}
.island{background:rgba(255,255,255,.35);padding:10px 6px 14px;text-align:center;border-radius:28px;transition:transform .2s,background .2s}
.island svg{width:100%;max-width:150px;height:auto;display:block;margin:0 auto}
.island:hover{transform:translateY(-5px) rotate(-1.5deg);background:rgba(255,255,255,.6)}
.island .name{font-size:21px;font-weight:800;line-height:1.25}
.island .meta{font-size:14px;font-weight:600;opacity:.8}
.bar{height:12px;background:#fff;border-radius:9px;margin:6px auto 0;max-width:120px;overflow:hidden;border:2px solid #fff}
.bar i{display:block;height:100%;border-radius:9px;background:var(--butter)}
.island.locked{cursor:not-allowed;filter:saturate(.35);opacity:.75}
.island.locked:hover{transform:none;background:rgba(255,255,255,.35)}
.foot{display:flex;justify-content:center;margin-top:26px}

/* 答題 */
.quiz{max-width:660px;margin:0 auto}
.qtop{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.dots{display:flex;gap:6px;flex:1;flex-wrap:wrap}
.dots i{width:22px;height:22px;border-radius:50%;background:rgba(255,255,255,.55);display:grid;place-items:center;font-style:normal;font-size:12px;font-weight:800;color:#fff;border:2px solid #fff}
.dots i.ok{background:var(--mint)} .dots i.no{background:var(--no)} .dots i.now{background:var(--butter);transform:scale(1.15)}
.qtag{display:inline-block;font-size:14px;font-weight:800;color:#fff;border-radius:999px;padding:2px 12px;margin-bottom:10px}
.qtext{font-size:22px;font-weight:600;margin:0 0 18px;white-space:pre-wrap}
.opts{display:grid;gap:10px}
.opt{background:#fff;text-align:left;padding:14px 16px;font-size:19px;font-weight:600;display:flex;gap:12px;align-items:center;border:3px solid #f1e3c8;box-shadow:0 4px 0 #f1e3c8;transition:transform .1s}
.opt .k{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--cream2);font-weight:800}
.opt:hover:not(:disabled){border-color:var(--peach);transform:translateY(-2px)}
.opt:disabled{cursor:default}
.opt.right{background:var(--ok-bg);border-color:var(--ok);box-shadow:0 4px 0 var(--ok)}
.opt.right .k{background:var(--ok);color:#fff}
.opt.wrong{background:var(--no-bg);border-color:var(--no);box-shadow:0 4px 0 var(--no);animation:shake .35s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.tf{grid-template-columns:1fr 1fr}
.tf .opt{justify-content:center;font-size:40px;padding:18px}
.fb{margin-top:16px}
.fb .say{border:3px solid transparent}
.fb.ok .say{background:var(--ok-bg)} .fb.ok .say::before{border-right-color:var(--ok-bg)}
.fb.no .say{background:var(--no-bg)} .fb.no .say::before{border-right-color:var(--no-bg)}
.fb h3{font-size:21px}
.fb p{margin:4px 0 0;font-weight:400}
.actions{display:flex;justify-content:flex-end;margin-top:16px;gap:10px}

/* 結算 */
.result{text-align:center}
.result svg.mascot{width:130px;height:auto}
.result h2{font-size:32px;margin:6px 0}
.big{font-size:64px;font-weight:800;line-height:1;color:var(--peach);font-variant-numeric:tabular-nums}
.gains{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin:18px 0}
.gain{background:#fff;border-radius:22px;padding:10px 16px;min-width:100px;font-weight:600;box-shadow:0 4px 0 rgba(74,69,102,.08)}
.gain svg{width:34px;height:34px;display:block;margin:0 auto 2px}
.gain b{display:block;font-size:24px}
.stampin{animation:stamp .6s cubic-bezier(.2,1.6,.4,1) both}
@keyframes stamp{from{transform:scale(2.4) rotate(-30deg);opacity:0}to{transform:scale(1) rotate(-8deg);opacity:1}}
.loading{text-align:center;padding:60px 0;font-size:22px;font-weight:800}
.loading svg{width:110px;display:block;margin:0 auto 8px}
/* 答對時的小星星 */
.spark{position:fixed;pointer-events:none;z-index:9;width:18px;height:18px;animation:pop .9s ease-out forwards}
@keyframes pop{to{transform:translate(var(--dx),var(--dy)) rotate(200deg) scale(.4);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:420px){.logo h1{font-size:38px}.qtext{font-size:20px}.talk svg.mascot{width:72px}}
</style>
</head>
<body>
<div class="sky" aria-hidden="true">
  <div class="cloud c1"></div><div class="cloud c2"></div><div class="cloud c3"></div>
  <div class="bubble" style="left:12%;animation-delay:-2s"></div><div class="bubble" style="left:38%;animation-delay:-7s;width:8px;height:8px"></div>
  <div class="bubble" style="left:66%;animation-delay:-4s"></div><div class="bubble" style="left:88%;animation-delay:-9s;width:16px;height:16px"></div>
</div>
<div class="wrap">

  <section id="vLogin" class="login">
    <div class="logo"><h1>知識群島</h1><p>每天上島挑戰一回，收集金幣、星星和印章</p></div>
    <div class="talk"><span class="bob" id="loginMascot"></span><div class="say">我是船長波波！輸入座號和密碼，我們出發囉～</div></div>
    <form id="fLogin" class="card form" autocomplete="off">
      <div><label for="iCode">班級代碼</label><input id="iCode" required placeholder="老師給的代碼" autocapitalize="characters"></div>
      <div class="row2">
        <div><label for="iSeat">座號</label><input id="iSeat" type="number" inputmode="numeric" min="1" max="60" required></div>
        <div><label for="iPin">4 位數密碼</label><input id="iPin" type="password" inputmode="numeric" maxlength="4" pattern="\d{4}" required></div>
      </div>
      <div><label for="iNick">暱稱（第一次登入才需要，可不填）</label><input id="iNick" maxlength="10"></div>
      <p class="hint">第一次登入時，你輸入的密碼就會變成你的密碼，要記住喔。</p>
      <label class="check"><input type="checkbox" id="iRemember">在這台裝置記住我（家裡的平板才勾）</label>
      <p class="err" id="loginErr"></p>
      <button class="btn" id="bLogin">出航！</button>
    </form>
  </section>

  <section id="vMap" class="hidden">
    <div class="top">
      <div class="who"><b id="whoName"></b><small id="whoClass"></small></div>
      <div class="chips">
        <span class="chip" title="金幣"><span class="ic-coin"></span><span id="cCoins">0</span></span>
        <span class="chip" title="星星"><span class="ic-star"></span><span id="cStars">0</span></span>
        <span class="chip" title="連續天數"><span class="ic-fire"></span><span><span id="cStreak">0</span> 天</span></span>
      </div>
    </div>
    <div class="talk today"><span class="bob" id="mapMascot"></span>
      <div class="say"><div class="seal" id="todaySeal">今日</div><span id="todayText"></span></div></div>
    <div class="map" id="map"></div>
    <div class="foot"><button class="btn soft small" id="bLogout">登出</button></div>
  </section>

  <section id="vQuiz" class="quiz hidden">
    <div class="qtop"><div class="dots" id="dots"></div><button class="btn soft small" id="bQuit">回地圖</button></div>
    <div class="card">
      <div class="qtag" id="qTag"></div>
      <p class="qtext" id="qText"></p>
      <div id="qBody"></div>
      <div id="qFb"></div>
      <div class="actions"><button class="btn hidden" id="bNext">下一題</button></div>
    </div>
  </section>

  <section id="vResult" class="quiz hidden">
    <div class="card result" id="resultBox"></div>
  </section>

  <div id="vLoading" class="loading hidden"><span class="bob" id="loadMascot"></span>划船中…</div>
</div>

<script>
const SUBJ = [
  {k:'國語', ch:'國', c:'#ff9f80', d:'#ef7f5f'}, {k:'數學', ch:'數', c:'#7cc2ff', d:'#549fe0'}, {k:'自然', ch:'自', c:'#6fd3a0', d:'#45b37d'},
  {k:'社會', ch:'社', c:'#ffc94d', d:'#e4a823'}, {k:'英文', ch:'英', c:'#b39cf5', d:'#8e72e0'}
];
const SC = Object.fromEntries(SUBJ.map(s => [s.k, s]));
let cred = null, state = null, round = null;

function api(fn, ...args){
  return new Promise((res, rej) => {
    google.script.run.withSuccessHandler(res).withFailureHandler(e => rej(e && e.message ? e : new Error(String(e))))[fn](...args);
  });
}
const $ = id => document.getElementById(id);
function show(v){ ['vLogin','vMap','vQuiz','vResult','vLoading'].forEach(x => $(x).classList.toggle('hidden', x !== v)); window.scrollTo(0,0); }
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function store(k, v){ try{ v === undefined ? localStorage.removeItem(k) : localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
function load(k){ try{ return JSON.parse(localStorage.getItem(k)); }catch(e){ return null; } }

/* ---------- 插圖 ---------- */
/* 船長波波：戴水手帽的小海豹。mood: happy / cheer / oops / sleep */
function mascot(mood){
  const mouth = {
    happy:'<path d="M54 74 Q60 80 66 74" stroke="#4a4566" stroke-width="3" fill="none" stroke-linecap="round"/>',
    cheer:'<path d="M52 72 Q60 86 68 72 Z" fill="#4a4566"/><path d="M56 78 Q60 82 64 78" fill="#ff8fa3"/>',
    oops:'<ellipse cx="60" cy="76" rx="4" ry="5" fill="#4a4566"/>',
    sleep:'<path d="M55 76 Q60 74 65 76" stroke="#4a4566" stroke-width="3" fill="none" stroke-linecap="round"/>'
  }[mood || 'happy'];
  const eyes = mood === 'sleep'
    ? '<path d="M40 62 Q45 66 50 62 M70 62 Q75 66 80 62" stroke="#4a4566" stroke-width="3" fill="none" stroke-linecap="round"/>'
    : mood === 'cheer'
    ? '<path d="M39 64 Q45 56 51 64 M69 64 Q75 56 81 64" stroke="#4a4566" stroke-width="3.5" fill="none" stroke-linecap="round"/>'
    : '<g class="blink"><ellipse cx="45" cy="62" rx="5" ry="6" fill="#4a4566"/><ellipse cx="75" cy="62" rx="5" ry="6" fill="#4a4566"/><circle cx="47" cy="59.5" r="2" fill="#fff"/><circle cx="77" cy="59.5" r="2" fill="#fff"/></g>';
  const arms = mood === 'cheer'
    ? '<path d="M22 84 Q8 66 14 56" stroke="#a9c7dc" stroke-width="10" fill="none" stroke-linecap="round"/><path d="M98 84 Q112 66 106 56" stroke="#a9c7dc" stroke-width="10" fill="none" stroke-linecap="round"/>'
    : '<ellipse cx="22" cy="96" rx="9" ry="14" transform="rotate(30 22 96)" fill="#a9c7dc"/><ellipse cx="98" cy="96" rx="9" ry="14" transform="rotate(-30 98 96)" fill="#a9c7dc"/>';
  return `<svg class="mascot" viewBox="0 0 120 124" aria-hidden="true">
    <ellipse cx="60" cy="118" rx="38" ry="5" fill="rgba(74,69,102,.12)"/>
    ${arms}
    <path d="M18 92 C18 50 36 34 60 34 C84 34 102 50 102 92 C102 112 84 118 60 118 C36 118 18 112 18 92 Z" fill="#cfe3f0"/>
    <ellipse cx="60" cy="98" rx="26" ry="18" fill="#eef6fb"/>
    <ellipse cx="36" cy="74" rx="7" ry="4.5" fill="#ffb3c1" opacity=".9"/><ellipse cx="84" cy="74" rx="7" ry="4.5" fill="#ffb3c1" opacity=".9"/>
    ${eyes}
    <ellipse cx="60" cy="69" rx="5" ry="3.5" fill="#4a4566"/>${mouth}
    <path d="M32 44 Q60 22 88 44 L84 50 Q60 38 36 50 Z" fill="#fff"/>
    <path d="M36 50 Q60 38 84 50 L82 55 Q60 45 38 55 Z" fill="#7cc2ff"/>
    <path d="M46 36 Q60 14 74 36 Q60 30 46 36 Z" fill="#fff"/>
    <circle cx="60" cy="26" r="4" fill="#ff8fa3"/>
    ${mood === 'sleep' ? '<text x="92" y="30" font-size="16" font-weight="800" fill="#8a85a3">z</text><text x="102" y="18" font-size="12" font-weight="800" fill="#8a85a3">z</text>' : ''}
  </svg>`;
}

/* 有臉的小島：沙灘、彩色草地、椰子樹、旗子上寫科目字 */
function islandSvg(s, seed, locked){
  const tilt = [0, 5, -4, 3, -3][seed % 5];
  const face = locked
    ? '<path d="M64 84 Q68 87 72 84 M88 84 Q92 87 96 84" stroke="#4a4566" stroke-width="2.5" fill="none" stroke-linecap="round"/><text x="104" y="62" font-size="13" font-weight="800" fill="#8a85a3">z z</text>'
    : '<g class="blink"><ellipse cx="68" cy="84" rx="3.5" ry="4.5" fill="#4a4566"/><ellipse cx="92" cy="84" rx="3.5" ry="4.5" fill="#4a4566"/></g><path d="M75 91 Q80 96 85 91" stroke="#4a4566" stroke-width="2.5" fill="none" stroke-linecap="round"/>';
  return `<svg viewBox="0 0 160 130" aria-hidden="true">
    <ellipse cx="80" cy="112" rx="70" ry="12" fill="rgba(255,255,255,.6)"/>
    <path d="M14 108 C14 ${78+tilt} 40 62 80 62 C120 62 146 ${78-tilt} 146 108 Z" fill="#ffe7b8"/>
    <path d="M22 80 C30 ${60+tilt} 52 52 80 52 C108 52 130 ${60-tilt} 138 80 C120 72 104 76 92 72 C80 68 70 74 58 72 C44 70 34 78 22 80 Z" fill="${s.c}"/>
    ${face}
    <ellipse cx="60" cy="92" rx="6" ry="3.5" fill="#ffb3c1" opacity=".85"/><ellipse cx="100" cy="92" rx="6" ry="3.5" fill="#ffb3c1" opacity=".85"/>
    <path d="M38 64 Q34 42 42 22" stroke="#c99a6a" stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M42 22 Q28 16 18 26 Q30 22 42 24 Q36 10 24 8 Q38 10 44 22 Q52 8 64 10 Q52 14 44 23 Q58 18 66 28 Q54 22 42 24 Z" fill="${s.d}"/>
    <circle cx="44" cy="26" r="3.5" fill="#a8774a"/><circle cx="39" cy="27" r="3" fill="#a8774a"/>
    <path d="M114 58 L114 12" stroke="#4a4566" stroke-width="3" stroke-linecap="round"/>
    <path d="M115 12 L154 22 L115 34 Z" fill="#fff" stroke="${s.d}" stroke-width="2.5" stroke-linejoin="round"/>
    <text x="129" y="29" text-anchor="middle" font-size="15" font-weight="800" fill="${s.d}" font-family="Chiron GoRound TC, Noto Sans TC, sans-serif">${s.ch}</text>
  </svg>`;
}
function reefSvg(empty){ return `<svg viewBox="0 0 160 130" aria-hidden="true"><ellipse cx="80" cy="112" rx="62" ry="11" fill="rgba(255,255,255,.6)"/>
  <path d="M28 108 C26 80 44 56 76 54 C110 52 134 76 132 108 Z" fill="#c8b8e8"/>
  <path d="M50 64 C54 50 66 44 76 46 C70 52 66 58 64 66 Z" fill="#ff9fb3"/><path d="M106 70 C112 56 122 54 128 60 C120 62 116 68 114 76 Z" fill="#ffb3c1"/>
  ${empty ? '<path d="M64 84 Q68 80 72 84 M88 84 Q92 80 96 84" stroke="#4a4566" stroke-width="2.5" fill="none" stroke-linecap="round"/><path d="M73 92 Q80 99 87 92" stroke="#4a4566" stroke-width="2.5" fill="none" stroke-linecap="round"/>'
    : '<ellipse cx="68" cy="84" rx="3.5" ry="4.5" fill="#4a4566"/><ellipse cx="92" cy="84" rx="3.5" ry="4.5" fill="#4a4566"/><path d="M74 95 Q80 90 86 95" stroke="#4a4566" stroke-width="2.5" fill="none" stroke-linecap="round"/><rect x="96" y="70" width="22" height="9" rx="4" transform="rotate(-25 107 74)" fill="#ffe7b8" stroke="#e6c48e" stroke-width="1.5"/>'}
  <ellipse cx="60" cy="92" rx="6" ry="3.5" fill="#ffb3c1"/><ellipse cx="100" cy="92" rx="6" ry="3.5" fill="#ffb3c1"/></svg>`; }
function lighthouseSvg(){ return `<svg viewBox="0 0 160 130" aria-hidden="true"><ellipse cx="80" cy="114" rx="58" ry="10" fill="rgba(255,255,255,.6)"/>
  <path d="M30 112 C40 94 120 94 130 112 Z" fill="#ffe7b8"/>
  <path d="M90 30 L148 14 L148 50 Z" fill="rgba(255,214,107,.55)"/>
  <path d="M64 104 L68 38 L92 38 L96 104 Z" fill="#fff"/>
  <path d="M66.4 64 L93.6 64 L94.6 80 L65.4 80 Z M67.6 44 L92.4 44 L93 54 L67 54 Z" fill="#ff8fa3"/>
  <rect x="64" y="24" width="32" height="15" rx="6" fill="#ffd66b"/><path d="M60 26 Q80 6 100 26 Z" fill="#ff8fa3"/>
  <ellipse cx="74" cy="90" rx="2.8" ry="3.6" fill="#4a4566"/><ellipse cx="86" cy="90" rx="2.8" ry="3.6" fill="#4a4566"/>
  <path d="M77 96 Q80 99 83 96" stroke="#4a4566" stroke-width="2" fill="none" stroke-linecap="round"/>
  <ellipse cx="70" cy="96" rx="3.5" ry="2" fill="#ffb3c1"/><ellipse cx="90" cy="96" rx="3.5" ry="2" fill="#ffb3c1"/></svg>`; }
const IC = {
  coin:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="#ffd66b" stroke="#e8b23a" stroke-width="2"/><circle cx="12" cy="12" r="5.5" fill="none" stroke="#e8b23a" stroke-width="1.8"/><path d="M7 8 Q9 5 12 5" stroke="#fff" stroke-width="1.8" fill="none" stroke-linecap="round"/></svg>',
  star:'<svg viewBox="0 0 24 24"><path d="M12 2.5 L14.8 8.6 L21.4 9.3 L16.4 13.7 L17.9 20.3 L12 16.9 L6.1 20.3 L7.6 13.7 L2.6 9.3 L9.2 8.6 Z" fill="#ffd66b" stroke="#e8b23a" stroke-width="1.6" stroke-linejoin="round"/></svg>',
  fire:'<svg viewBox="0 0 24 24"><path d="M12 2 C14 6 18 8 18 14 a6 6 0 0 1 -12 0 C6 10 9 9 9 5 C11 7 11 8 12 2 Z" fill="#ff9f80"/><path d="M12 11 C13 13 15 14 15 16 a3 3 0 0 1 -6 0 C9 14 11 14 12 11 Z" fill="#ffd66b"/></svg>'
};
document.querySelectorAll('.ic-coin').forEach(e => e.innerHTML = IC.coin);
document.querySelectorAll('.ic-star').forEach(e => e.innerHTML = IC.star);
document.querySelectorAll('.ic-fire').forEach(e => e.innerHTML = IC.fire);
$('loginMascot').innerHTML = mascot('happy');
$('loadMascot').innerHTML = mascot('happy');

function sparkle(el){
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const r = el.getBoundingClientRect();
  const cols = ['#ffd66b','#ff8fa3','#7fd8b5','#7cc2ff','#b9a6f0'];
  for (let i = 0; i < 12; i++){
    const s = document.createElement('div'); s.className = 'spark';
    s.innerHTML = IC.star.replace(/#ffd66b/, cols[i % 5]);
    s.style.left = (r.left + r.width / 2) + 'px'; s.style.top = (r.top + r.height / 2) + 'px';
    s.style.setProperty('--dx', (Math.cos(i / 12 * 6.28) * (60 + Math.random() * 50)) + 'px');
    s.style.setProperty('--dy', (Math.sin(i / 12 * 6.28) * (60 + Math.random() * 50)) + 'px');
    document.body.appendChild(s); setTimeout(() => s.remove(), 1000);
  }
}

/* ---------- 地圖 ---------- */
function renderMap(){
  const s = state;
  $('whoName').textContent = (s.nick || (s.seat + ' 號')) + ' 的冒險日誌';
  $('whoClass').textContent = s.className + '・' + s.seat + ' 號';
  $('cCoins').textContent = s.coins; $('cStars').textContent = s.stars; $('cStreak').textContent = s.streak;
  $('todaySeal').className = 'seal' + (s.todayDone ? ' on' : '');
  $('todaySeal').textContent = s.todayDone ? '已蓋章' : '今日';
  $('mapMascot').innerHTML = mascot(s.todayDone ? 'cheer' : 'happy');
  $('todayText').textContent = s.todayDone
    ? '今天的印章拿到了，好棒！還想玩的話可以繼續賺金幣喔。'
    : '選一座島出發吧！答對 ' + Math.ceil(s.perRound * 0.7) + ' 題以上，就能蓋今天的印章。';
  const cards = SUBJ.map((sj, i) => {
    const it = s.islands[sj.k] || {total:0, mastered:0};
    const locked = !it.total;
    const pct = it.total ? Math.round(it.mastered / it.total * 100) : 0;
    return `<button class="island${locked?' locked':''}" data-island="${sj.k}" ${locked?'aria-disabled="true"':''}>
      ${islandSvg(sj, i, locked)}<div class="name">${sj.k}島</div>
      <div class="meta">${locked ? '還在睡覺，等老師開放' : '已掌握 ' + it.mastered + ' / ' + it.total}</div>
      <div class="bar"><i style="width:${pct}%;background:${sj.c}"></i></div></button>`;
  });
  cards.push(`<button class="island${s.wrong?'':' locked'}" data-island="錯題">${reefSvg(!s.wrong)}<div class="name">錯題礁</div><div class="meta">${s.wrong ? '有 ' + s.wrong + ' 題等你救援' : '沒有錯題，太厲害了'}</div></button>`);
  const any = SUBJ.some(sj => (s.islands[sj.k]||{}).total);
  cards.push(`<button class="island${any?'':' locked'}" data-island="綜合">${lighthouseSvg()}<div class="name">燈塔挑戰</div><div class="meta">各科混合出題</div></button>`);
  $('map').innerHTML = cards.join('');
}

$('map').addEventListener('click', e => {
  const b = e.target.closest('.island');
  if (!b || b.classList.contains('locked')) return;
  startRound(b.dataset.island);
});

async function startRound(island){
  show('vLoading');
  try{
    const qs = await api('getRound', cred, island);
    round = {island, qs, i:0, res:[]};
    show('vQuiz'); renderQ();
  }catch(e){ show('vMap'); $('todayText').textContent = e.message; }
}

/* ---------- 答題 ---------- */
function renderQ(){
  const q = round.qs[round.i];
  renderDots();
  const c = SC[q.subject] || SUBJ[0];
  $('qTag').style.background = c.d;
  $('qTag').textContent = q.subject + '・' + q.unit + '　' + (round.i + 1) + ' / ' + round.qs.length;
  $('qText').textContent = q.text;
  $('qFb').innerHTML = ''; $('bNext').classList.add('hidden');
  if (q.type === '選擇'){
    $('qBody').innerHTML = '<div class="opts">' + q.options.map((o, i) =>
      `<button class="opt" data-a="${'ABCD'[i]}"><span class="k">${'ABCD'[i]}</span><span>${esc(o)}</span></button>`).join('') + '</div>';
  } else if (q.type === '是非'){
    $('qBody').innerHTML = '<div class="opts tf"><button class="opt" data-a="O" aria-label="對">○</button><button class="opt" data-a="X" aria-label="錯">✕</button></div>';
  } else {
    $('qBody').innerHTML = '<form id="fFill" class="form"><input id="iFill" autocomplete="off" placeholder="在這裡輸入答案"><div class="actions" style="margin:0"><button class="btn">送出</button></div></form>';
    $('fFill').addEventListener('submit', ev => { ev.preventDefault(); const v = $('iFill').value.trim(); if (v) answer(v, $('iFill')); });
    setTimeout(() => $('iFill').focus(), 50);
  }
}
function renderDots(){
  $('dots').innerHTML = round.qs.map((_, i) => {
    const r = round.res[i];
    return `<i class="${r ? (r.ok ? 'ok' : 'no') : (i === round.i ? 'now' : '')}">${r ? (r.ok ? '✓' : '') : ''}</i>`;
  }).join('');
}

$('qBody').addEventListener('click', e => {
  const b = e.target.closest('.opt');
  if (b && !b.disabled) answer(b.dataset.a, b);
});

function norm(v){ return String(v||'').replace(/[！-～]/g, c => String.fromCharCode(c.charCodeAt(0)-0xFEE0)).replace(/\s+/g,'').toLowerCase(); }
function tf(v){ const s = norm(v); if (['o','○','對','是','t','true','y'].includes(s)) return 'O'; if (['x','╳','×','錯','否','f','false','n'].includes(s)) return 'X'; return null; }
function check(q, a){
  if (q.type === '選擇') return norm(a).toUpperCase() === norm(q.answer).toUpperCase();
  if (q.type === '是非') return tf(a) !== null && tf(a) === tf(q.answer);
  return q.answer.split('|').some(r => norm(r) && norm(r) === norm(a));
}
function answerLabel(q){
  if (q.type === '選擇'){ const i = 'ABCD'.indexOf(q.answer.trim().toUpperCase()); return q.answer.toUpperCase() + (q.options[i] ? '　' + q.options[i] : ''); }
  if (q.type === '是非') return tf(q.answer) === 'O' ? '○（對）' : '✕（錯）';
  return q.answer.split('|')[0];
}
const YAY = ['答對了！金幣 +1', '好厲害！金幣 +1', '太棒了！金幣 +1', '完全正確！金幣 +1'];
const OOPS = ['差一點點！', '沒關係，下次就會了！', '喔喔，再想想看～'];

function answer(a, el){
  const q = round.qs[round.i];
  const ok = check(q, a);
  round.res[round.i] = {id:q.id, answer:a, ok};
  document.querySelectorAll('#qBody .opt, #qBody input, #qBody button').forEach(x => x.disabled = true);
  if (el && el.classList.contains('opt')) el.classList.add(ok ? 'right' : 'wrong');
  if (!ok && q.type !== '填空'){
    const want = q.type === '是非' ? tf(q.answer) : q.answer.trim().toUpperCase();
    const rb = document.querySelector(`#qBody .opt[data-a="${want}"]`); if (rb) rb.classList.add('right');
  }
  if (ok && el) sparkle(el);
  const pick = arr => arr[Math.floor(Math.random() * arr.length)];
  $('qFb').innerHTML = `<div class="fb ${ok?'ok':'no'}"><div class="talk"><span class="bob">${mascot(ok ? 'cheer' : 'oops')}</span><div class="say">
    <h3>${ok ? pick(YAY) : pick(OOPS)}</h3>
    ${ok ? '' : '<p>正確答案：<b>' + esc(answerLabel(q)) + '</b></p>'}${q.explain ? '<p>' + esc(q.explain) + '</p>' : ''}</div></div></div>`;
  const last = round.i === round.qs.length - 1;
  $('bNext').textContent = last ? '看結果' : '下一題';
  $('bNext').classList.remove('hidden'); $('bNext').focus();
  renderDots();
}

$('bNext').addEventListener('click', async () => {
  if (round.i < round.qs.length - 1){ round.i++; renderQ(); return; }
  show('vLoading');
  try{
    const r = await api('submitRound', cred, round.island, round.res.map(x => ({id:x.id, answer:x.answer})));
    state = r.state; renderResult(r);
  }catch(e){
    show('vResult');
    $('resultBox').innerHTML = `${mascot('oops')}<h2>上傳失敗</h2><p>${esc(e.message)}</p><p class="hint">請確認網路後再按一次。</p><div class="actions" style="justify-content:center"><button class="btn" id="bRetry">再上傳一次</button></div>`;
    $('bRetry').onclick = () => $('bNext').click();
  }
});

function renderResult(r){
  show('vResult');
  const msg = r.passed ? (r.correct === r.total ? '全部答對，你是天才！' : '過關了，好棒！') : '這回沒過關，再試一次吧';
  $('resultBox').innerHTML = `<span class="bob">${mascot(r.passed ? 'cheer' : 'happy')}</span><h2>${msg}</h2>
    <div class="big">${r.correct}<span style="font-size:28px"> / ${r.total}</span></div>
    <div class="gains">
      <div class="gain">${IC.coin}金幣<b>+${r.coins}</b></div>
      <div class="gain">${IC.star}星星<b>${r.star ? '+1' : '+0'}</b></div>
      ${r.stamp ? `<div class="gain"><div class="seal on stampin" style="margin:0 auto 4px">已蓋章</div>今日印章</div>` : ''}
    </div>
    ${r.stamp ? '<p>連續完成 <b>' + r.state.streak + '</b> 天！印章可以跟老師換加點喔。</p>' : ''}
    ${r.correct < r.total ? '<p class="hint">答錯的題目跑去錯題礁了，答對就能救回來。</p>' : ''}
    <div class="actions" style="justify-content:center"><button class="btn" id="bBack">回群島地圖</button></div>`;
  if (r.passed) setTimeout(() => sparkle(document.querySelector('#resultBox .big')), 200);
  $('bBack').onclick = () => { renderMap(); show('vMap'); };
}

$('bQuit').addEventListener('click', () => { renderMap(); show('vMap'); });

/* ---------- 登入 ---------- */
$('fLogin').addEventListener('submit', async ev => {
  ev.preventDefault();
  const c = {code:$('iCode').value.trim().toUpperCase(), seat:Number($('iSeat').value), pin:$('iPin').value.trim(), nick:$('iNick').value.trim()};
  $('loginErr').textContent = ''; $('bLogin').disabled = true;
  try{
    state = await api('studentLogin', c);
    cred = {code:c.code, seat:c.seat, pin:c.pin};
    store('kq_code', c.code);
    if ($('iRemember').checked) store('kq_cred', cred); else store('kq_cred');
    renderMap(); show('vMap');
  }catch(e){ $('loginErr').textContent = e.message; }
  $('bLogin').disabled = false;
});

$('bLogout').addEventListener('click', () => { store('kq_cred'); cred = null; state = null; $('iPin').value = ''; $('iSeat').value = ''; show('vLogin'); });

(async function init(){
  const saved = load('kq_cred');
  $('iCode').value = load('kq_code') || '';
  try{ google.script.url.getLocation(loc => { if (loc.parameter && loc.parameter.c) $('iCode').value = loc.parameter.c.toUpperCase(); }); }catch(e){}
  if (saved){
    show('vLoading');
    try{ state = await api('studentLogin', saved); cred = saved; renderMap(); show('vMap'); return; }
    catch(e){ store('kq_cred'); }
  }
  show('vLogin');
})();
</script>
</body>
